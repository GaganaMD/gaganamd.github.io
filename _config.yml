# GitHub Pages runs Jekyll on this repository, but Jekyll only copies files here:
# the HTML pages are generated by _build/ (see README.md).
#
# Paths listed below are never published on https://gaganamd.github.io.
# Folders whose names start with "_" (such as _build/ and _private/) are never published either.
# Note: excluding a file from the website does NOT hide it on GitHub, because the repository is public.
# Folder entries end with "/" so that, for example, "cv/" does not also exclude cv.pdf.
exclude:
  - README.md
  - MAINTENANCE.md
  - TODO.md
  - cv/
  - assets/img/options/
  - templates/
  - "Claude outputs/"

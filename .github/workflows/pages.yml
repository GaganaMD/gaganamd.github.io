name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The build job has no write access. The deploy job receives Pages credentials only after
# the explicit repository-variable gate is enabled during the reviewed cutover.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-python@v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: _build/requirements.txt
      - name: Install build dependencies
        run: python -m pip install --requirement _build/requirements.txt
      - name: Build generated pages
        run: python -B _build/site.py build
      - name: Validate site and privacy
        run: python -B _build/site.py check
      - name: Package public Pages artifact
        run: python -B _build/package.py "$RUNNER_TEMP/pages-artifact"
      - name: Verify Pages artifact
        run: python -B _build/package.py --verify "$RUNNER_TEMP/pages-artifact"
      - name: Upload Pages artifact
        # actions/upload-pages-artifact@v3
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ${{ runner.temp }}/pages-artifact

  deploy:
    needs: build
    # Keep branch-based Pages authoritative until the controlled cutover explicitly sets this variable.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_ACTIONS_DEPLOY == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Pages artifact
        id: deployment
        # actions/deploy-pages@v4
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

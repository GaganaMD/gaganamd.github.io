# Papers and reports. One entry per publication; edit here, then rebuild.
#
# Order in this file = order on the Research page (grouped by `group`, groups in order of first appearance).
# `home` (optional): show the paper in the homepage "Research papers" list, sorted by `home.order`.
#
# Fields
#   id                unique, lowercase-with-dashes
#   title             exact title (quote it if it contains ": ")
#   url               optional: the Research page title links here
#   authors           list, in the official published order
#   me                the exact form of your name in `authors` (shown in bold)
#   equal_contribution  optional: number of leading authors marked * (Research page only, adds "*Equal contribution.")
#   group             Research page heading: Peer-reviewed | Reports | Manuscripts
#   venue, note       one line of Markdown each (links as [text](url), anchors as [More](#slug))
#   home.venue, home.role, home.tag   homepage texts; home.peer: true gives the green "Peer-reviewed" style
#   home.links        list of {label, url} buttons on the homepage


# Experience entries. `home` renders a homepage row; `about` renders a timeline entry on About.
# Keep HTML in paragraphs verbatim so generated pages retain their existing bytes.
- id: sentient-futures
  home:
    order: 1
    title: Project Incubator
    org: Sentient Futures
    when: Sep 2026 – present
    description: "Two projects, mentored by Julia Bossmann: the Gap Attractor Project and the Post-Control Initiative."
  about:
    order: 1
    group: AI safety research programs
    time: Sep 2026 – present
    title: Sentient Futures
    position: Project Incubator · two projects · mentored by Julia Bossmann
    multiline: true
    paragraphs:
      - >-
        <strong>The Gap Attractor Project</strong> (Oct 2026 – present, technical). Behavioural evaluations of whether frontier language models show stable, self-directed curiosity: autonomous information-seeking and question generation, tested across prompting conditions and controls.
      - >-
        <strong>Post-Control Initiative</strong> (Sep 2026 – present, post-AGI governance and field building). Preparing for a world where AI control no longer scales and advanced AI systems are parties we negotiate with rather than tools we direct. I lead interdisciplinary roundtables across AI safety, governance and game theory on trust, verification and credible commitments when human control can't be assumed, and write the discussion frameworks and syntheses that come out of them. I designed and hosted the first one, <a class="text-link" href="speaking.html#roundtable">“What makes cooperation without control work?”</a> (Oct 2026).

  about:
    order: 2
    group: AI safety research programs
    time: May – Oct 2026
    title: PRISM AI Safety Research Fellowship
    position: Technical Research Contributor and Program Support Volunteer · completed
    paragraphs:
      - >-
        <strong>Technical research</strong> (world-models project, mentored by Jobst Heitzig). I implemented the evaluation pipeline, the world-model analysis library and the test suite, and contributed to the experiments. Our five-author paper, <em>Evaluating LLM-Generated World Models for Neuro-Symbolic Reasoning</em>, was accepted at the NeurIPS 2026 NEmo workshop (Neuro-Symbolic Embodied Intelligence).
      - >-
        <strong>Program support</strong> (volunteer). I helped coordinate and support the fellowship's interpretability and AI control research teams.

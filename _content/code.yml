- category: agents
  label: Agents &amp; evaluation
  title: When does agent orchestration pay off?
  text: Direct Codex vs Fabric-structured prompts vs Hermes + Fabric + Codex, on ten coding tasks, a ledger reconciliation and a 717-item due-diligence corpus. On one reconciliation run, full orchestration took 3.5× as long as direct Codex (270 s vs 78 s); on coding tasks it averaged about 1.6× slower. It only paid off when coverage and traceability mattered.
  evidence:
  - Run logs
  - Per-task verification
  meta: 2026 · sole developer · <a href="https://github.com/GaganaMD/benchmark_hermes-fabric-public">Code ↗</a>

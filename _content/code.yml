- category: research
  label: Research code · AI control
  title: Detection Is Not Containment
  text: Timing and cost of monitor-triggered interventions. The oracle and prompt are hash-frozen, and runs are deterministic and cached. October follow-ups add a preregistered 54-scenario study and a preregistered monitor-format ablation.
  evidence:
  - 12 test files
  - Release verifier
  - Std-lib only
  meta: 2026 · first author, built the experiment · <a href="detection-is-not-containment.html">Case study</a> · <a href="https://github.com/GaganaMD/detection-is-not-containment">Code ↗</a>
- category: research
  label: Research code · Multi-agent safety
  title: Do agents notice a swapped peer?
  text: Diner's Dilemma, Public Goods Game and RepeatedJira setups where one colluding agent is silently replaced, by another model or by a monitor, with probes, LLM-judge checks and behavioural AUCs.
  evidence:
  - Sprint report
